name: SIT_TEST2
description: Semantic view created for testing the OSSIE YAML setup.
tables:
  - name: CUSTOMER
    description: Customer master data
    base_table:
      database: SIT
      schema: COMPASS
      table: CUSTOMER
    primary_key:
      columns:
        - C_CUSTKEY
    dimensions:
      - name: C_CUSTKEY
        description: Customer key
        expr: C_CUSTKEY
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: C_NAME
        description: Customer name
        expr: C_NAME
        data_type: VARCHAR(25)
        access_modifier: public_access
      - name: C_NATIONKEY
        description: Nation key associated with the customer
        expr: C_NATIONKEY
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
  - name: LINEITEM
    description: Order line-item data
    base_table:
      database: SIT
      schema: COMPASS
      table: LINEITEM
    dimensions:
      - name: L_LINENUMBER
        description: Line number within the order
        expr: L_LINENUMBER
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: L_LINESTATUS
        description: Line-item status
        expr: L_LINESTATUS
        data_type: VARCHAR(1)
        access_modifier: public_access
      - name: L_ORDERKEY
        description: Order key associated with the line item
        expr: L_ORDERKEY
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
    facts:
      - name: L_EXTENDEDPRICE
        description: Extended price for the line item
        expr: L_EXTENDEDPRICE
        data_type: "NUMBER(12,2)"
        access_modifier: public_access
      - name: L_QUANTITY
        description: Quantity for the line item
        expr: L_QUANTITY
        data_type: "NUMBER(12,2)"
        access_modifier: public_access
  - name: NATION
    description: Nation reference data
    base_table:
      database: SIT
      schema: COMPASS
      table: NATION
    primary_key:
      columns:
        - N_NATIONKEY
    dimensions:
      - name: N_NAME
        description: Nation name
        expr: N_NAME
        data_type: VARCHAR(25)
        access_modifier: public_access
      - name: N_NATIONKEY
        description: Nation key
        expr: N_NATIONKEY
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: N_REGIONKEY
        description: Region key associated with the nation
        expr: N_REGIONKEY
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
  - name: ORDERS
    description: Order header data
    base_table:
      database: SIT
      schema: COMPASS
      table: ORDERS
    primary_key:
      columns:
        - O_ORDERKEY
    dimensions:
      - name: O_CUSTKEY
        description: Customer key associated with the order
        expr: O_CUSTKEY
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: O_ORDERKEY
        description: Order key
        expr: O_ORDERKEY
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: O_ORDERSTATUS
        description: Order status
        expr: O_ORDERSTATUS
        data_type: VARCHAR(1)
        access_modifier: public_access
    facts:
      - name: O_TOTALPRICE
        description: Total price for the order
        expr: O_TOTALPRICE
        data_type: "NUMBER(12,2)"
        access_modifier: public_access
    time_dimensions:
      - name: O_ORDERDATE
        description: Date when the order was placed
        expr: O_ORDERDATE
        data_type: DATE
        access_modifier: public_access
metrics:
  - name: AVERAGE_PRICE_PER_UNIT
    synonyms: []
    description: Total price divided by total quantity.
    expr: "total_price / NULLIF(total_quantity, 0)"
    access_modifier: public_access
  - name: TOTAL_PRICE
    synonyms: []
    description: The sum of total order price from the ORDERS table.
    expr: SUM(orders.o_totalprice)
    access_modifier: public_access
  - name: TOTAL_QUANTITY
    synonyms: []
    description: The sum of line-item quantity from the LINEITEM table.
    expr: SUM(lineitem.l_quantity)
    access_modifier: public_access
relationships:
  - name: CUSTOMER_TO_NATION
    left_table: CUSTOMER
    right_table: NATION
    relationship_columns:
      - left_column: C_NATIONKEY
        right_column: N_NATIONKEY
  - name: LINEITEM_TO_ORDERS
    left_table: LINEITEM
    right_table: ORDERS
    relationship_columns:
      - left_column: L_ORDERKEY
        right_column: O_ORDERKEY
  - name: ORDERS_TO_CUSTOMER
    left_table: ORDERS
    right_table: CUSTOMER
    relationship_columns:
      - left_column: O_CUSTKEY
        right_column: C_CUSTKEY
