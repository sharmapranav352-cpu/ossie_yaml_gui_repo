name: Semantic view sync

# Checks Snowflake on a schedule. If any semantic view was created, changed
# or dropped, it runs the build and opens a pull request with the new YAML.
#
# Set the database in: Settings > Secrets and variables > Actions >
# Variables > SV_DATABASE
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: semantic-view-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install snowflake-connector-python cryptography

      - name: Export semantic views from Snowflake
        id: export
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SV_DATABASE: ${{ vars.SV_DATABASE }}
        run: python scripts/export_semantic_views.py

      - name: No changes
        if: steps.export.outputs.changed != 'true'
        run: echo "No semantic views changed since the last sync."

      # ---- Your build goes here --------------------------------------------
      # Runs only when something changed: tests, validation, deploying to
      # another environment, notifying a channel, etc.
      - name: Build
        if: steps.export.outputs.changed == 'true'
        run: |
          echo "Changed or new: ${{ steps.export.outputs.changed_views }}"
          echo "Dropped:        ${{ steps.export.outputs.dropped_views }}"

      - name: Open a pull request with the updated YAML
        if: steps.export.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: semantic-view-sync
          commit-message: "Sync semantic views from Snowflake"
          title: "Semantic views changed in Snowflake"
          body: |
            Detected by the scheduled sync.

            **Database:** `${{ vars.SV_DATABASE }}`
            **Changed or new:** ${{ steps.export.outputs.changed_views }}
            **Dropped:** ${{ steps.export.outputs.dropped_views }}
          add-paths: semantic_views/**
          delete-branch: true
