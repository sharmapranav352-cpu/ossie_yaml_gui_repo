# Branding lives here. Change primaryColor to your brand colour and every
# accent in the app (buttons, progress bar, links) follows it.

[theme]
base = "light"
primaryColor = "#0A6FA8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F9"
textColor = "#17263A"
borderColor = "#D8E0E8"
linkColor = "#0A6FA8"
baseRadius = "0.375rem"
showWidgetBorder = true
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = 600
headingFontSizes = ["2.125rem", "1.375rem", "1.125rem"]

[theme.sidebar]
backgroundColor = "#F3F6F9"
secondaryBackgroundColor = "#FFFFFF"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
